name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 15 minutes was too thin: a full pytest run measures ~9.5 minutes locally, and on CI the
    # five PostgreSQL tests actually execute (instead of skipping), on top of image pull,
    # service startup and dependency installation.
    timeout-minutes: 25

    # The worker's LangGraph checkpointer behaves differently on PostgreSQL than on SQLite
    # (separate schema, psycopg connection). tests/test_indexing_graph_postgres.py exercises
    # that path and skips itself when IT_TEST_POSTGRES_URL is absent.
    #
    # tests/test_connection_pool.py also needs the service: it proves the configured
    # pool_size/max_overflow reach create_engine and that the pool bounds a concurrent write
    # burst, which is unobservable on SQLite (no pool there at all).
    #
    # The image must carry pgvector: migration 0003 runs `CREATE EXTENSION IF NOT EXISTS vector`,
    # so a plain `postgres` image fails with "extension vector is not available". This mirrors
    # compose.yaml, which already uses the pgvector image for the same reason.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: docmind_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-worker.txt
      # Fails the build if any tests/test_*.py contributes zero collected tests. Under the old
      # `unittest discover` runner 24 pytest-style tests were collected by nobody and silently
      # never ran; this step makes that class of gap impossible to reintroduce.
      - name: Check test suite completeness
        run: python -B scripts/check_suite_completeness.py
      - name: Run tests
        env:
          # The integration test creates and drops its own disposable database on this server,
          # so the role needs CREATEDB (the postgres image's superuser role has it).
          IT_TEST_POSTGRES_URL: postgresql+psycopg://docmind:change-me@127.0.0.1:5432/docmind_it
          # Written by tests/test_connection_pool.py and uploaded below. The numbers are the
          # evidence behind decision C in docs/proposal_async_handler_def_ify.md §9.1 (whether
          # the DB pool needs raising); they are deliberately an artifact, not an assertion.
          IT_POOL_REPORT: pool_concurrency_report.json
        # pytest (not `unittest discover`): the suite mixes unittest.TestCase with pytest-style
        # modules, and unittest discover only collects the former — leaving 24 tests (field
        # encryption, rate limiting, reranking) silently unexecuted. `-rs` prints skip reasons
        # so a test that silently opts out is visible in the log instead of being invisible.
        #
        # `set -o pipefail` is mandatory: without it the exit code of the pipeline is `tee`'s,
        # which would let a failing pytest run report green. The log is then scanned for
        # process-level crash markers, because a run was once observed emitting
        # "Windows fatal exception: access violation" while still exiting 0.
        run: |
          set -o pipefail
          python -B -m pytest -q -rs -p no:cacheprovider tests 2>&1 | tee pytest-output.log
          python -B scripts/check_run_log.py pytest-output.log
      # Kept even when the suite fails: the pool numbers are most interesting in exactly that
      # case (a burst that exhausted the pool shows up as 500s and a saturated peak).
      - name: Upload pool concurrency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pool-concurrency-report
          path: pool_concurrency_report.json
          if-no-files-found: ignore
      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q app.py admin_app.py assistant backend ingestion migrations tests worker
          node --check web/admin.js
      - name: Check dependency consistency
        run: python -m pip check

  golden-eval:
    runs-on: ubuntu-latest
    # The golden set holds 42 cases across two repos; only the half that lives in this repository
    # can be measured here (21 cases, 7 documents), the other repo is a local sibling and is
    # reported as SKIPPED. Budget generously anyway: the documents are imported through the real
    # HTTP stack and embedded. Runs in parallel with the unit suite below.
    timeout-minutes: 20

    # Reuses the same pgvector service: the script provisions and drops its own disposable database
    # on this server, so the run exercises the production pgvector + tsvector SQL RRF retrieval path
    # rather than the SQLite portable full-table-scan path that `unittest discover` used to run.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: docmind_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-worker.txt
      - name: Run golden evaluation against PostgreSQL
        env:
          IT_TEST_POSTGRES_URL: postgresql+psycopg://docmind:change-me@127.0.0.1:5432/docmind_it
          # The golden set spans two repositories and stores repo-relative document paths, resolved
          # by scripts/golden_paths.py. Only this repository is checked out here, so its root is
          # named explicitly; the rag-agent half lives beside it on the developer machine and is
          # reported as SKIPPED rather than scored as 0.
          IT_GOLDEN_ROOT_DOCMIND_IT_ASSISTANT: ${{ github.workspace }}
        # --gate-mode warn is the documented design: thresholds are exposed, not enforced. Switch it
        # to `block` to make a below-threshold corpus fail this job.
        #
        # Independently of the gate mode, the script now exits non-zero when it could not measure
        # anything (a missing document, an import failure, or no repository runnable at all). That
        # is the failure this job used to hide: the corpus resolved to nothing, every metric printed
        # 0.000, and the job still finished green.
        run: python -B scripts/run_golden_eval.py --embedding hash --gate-mode warn --out golden_report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-eval-report
          path: golden_report.json

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Audit locked dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-lock.txt
          python -m pip_audit -r requirements-worker-lock.txt
