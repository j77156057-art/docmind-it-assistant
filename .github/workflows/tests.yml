name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -B -m unittest discover -s tests -v
      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q app.py admin_app.py assistant backend ingestion migrations tests worker
          node --check web/admin.js
      - name: Check dependency consistency
        run: python -m pip check

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Audit locked dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-lock.txt
