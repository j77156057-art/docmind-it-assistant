name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # 15 minutes was too thin: a full pytest run measures ~9.5 minutes locally, and on CI the
    # four PostgreSQL tests actually execute (instead of skipping), on top of image pull,
    # service startup and dependency installation.
    timeout-minutes: 25

    # The worker's LangGraph checkpointer behaves differently on PostgreSQL than on SQLite
    # (separate schema, psycopg connection). tests/test_indexing_graph_postgres.py exercises
    # that path and skips itself when IT_TEST_POSTGRES_URL is absent.
    #
    # The image must carry pgvector: migration 0003 runs `CREATE EXTENSION IF NOT EXISTS vector`,
    # so a plain `postgres` image fails with "extension vector is not available". This mirrors
    # compose.yaml, which already uses the pgvector image for the same reason.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: docmind
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: docmind_it
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt -r requirements-worker.txt
      # Fails the build if any tests/test_*.py contributes zero collected tests. Under the old
      # `unittest discover` runner 24 pytest-style tests were collected by nobody and silently
      # never ran; this step makes that class of gap impossible to reintroduce.
      - name: Check test suite completeness
        run: python -B scripts/check_suite_completeness.py
      - name: Run tests
        env:
          # The integration test creates and drops its own disposable database on this server,
          # so the role needs CREATEDB (the postgres image's superuser role has it).
          IT_TEST_POSTGRES_URL: postgresql+psycopg://docmind:change-me@127.0.0.1:5432/docmind_it
        # pytest (not `unittest discover`): the suite mixes unittest.TestCase with pytest-style
        # modules, and unittest discover only collects the former — leaving 24 tests (field
        # encryption, rate limiting, reranking) silently unexecuted. `-rs` prints skip reasons
        # so a test that silently opts out is visible in the log instead of being invisible.
        run: python -B -m pytest -q -rs -p no:cacheprovider tests
      - name: Check Python and JavaScript syntax
        run: |
          python -m compileall -q app.py admin_app.py assistant backend ingestion migrations tests worker
          node --check web/admin.js
      - name: Check dependency consistency
        run: python -m pip check

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Audit locked dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements-lock.txt
          python -m pip_audit -r requirements-worker-lock.txt
