<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT 查询助手</title>
<style>:root{--ink:#15211e;--muted:#65716c;--line:#dce3df;--accent:#14755f;--wash:#f4f7f5}*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{height:62px;background:#17342c;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 980px)/2))}header b{font-size:18px}.tag{font-size:12px;color:#cce4dc}main{max-width:980px;margin:auto;background:#fff;min-height:calc(100vh - 62px);display:grid;grid-template-columns:minmax(0,1fr) 260px;border-inline:1px solid var(--line)}#chat{padding:24px;display:flex;flex-direction:column;gap:14px;min-height:560px}.msg{max-width:88%;white-space:pre-wrap}.user{align-self:flex-end;background:#e4f2ed;padding:10px 12px;border-radius:7px}.bot{border-left:3px solid var(--accent);padding-left:12px}.sources,.route{font-size:12px;color:var(--muted);margin-top:7px}.composer{display:flex;gap:8px;border-top:1px solid var(--line);padding:14px}textarea{flex:1;min-height:70px;resize:vertical;border:1px solid #b8c4be;border-radius:6px;padding:9px;font:inherit}button{border:0;border-radius:6px;background:var(--accent);color:#fff;padding:9px 16px;font:inherit;cursor:pointer}aside{border-left:1px solid var(--line);padding:20px}aside h2{font-size:15px;margin:0 0 12px}aside h2:not(:first-child){margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}#history{padding-left:18px;color:var(--muted)}#history li{margin:8px 0}.usage{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:13px;color:var(--muted)}.usage strong{color:var(--ink);font-variant-numeric:tabular-nums}@media(max-width:720px){main{display:block;border:0}aside{border-left:0;border-top:1px solid var(--line)}}</style></head>
<body><header><b>IT 查询助手</b><span class="tag">只读查询 · 数据库与模型由后台调配</span></header><main><section><div id="chat"><div class="msg bot">请描述 IT 问题。我只查询知识资料，不执行开发命令或修改系统。</div></div><div class="composer"><textarea id="q" placeholder="例如：VPN 提示凭据过期怎么办？"></textarea><button id="send">查询</button></div></section><aside><h2>本会话查询记录</h2><ol id="history"></ol><h2>模型用量</h2><div class="usage"><span>调用</span><strong id="calls">0</strong><span>Token</span><strong id="tokens">0</strong><span>费用</span><strong id="cost">¥0.000000</strong></div></aside></main>
<script>(()=>{const sid=sessionStorage.getItem('it_query_session')||crypto.randomUUID();sessionStorage.setItem('it_query_session',sid);const $=id=>document.getElementById(id);function msg(text,kind,meta){const d=document.createElement('div');d.className='msg '+kind;d.textContent=text;if(meta?.citations?.length){const s=document.createElement('div');s.className='sources';s.textContent='资料出处：'+meta.citations.map(x=>`${x.source} / ${x.section}（第 ${x.line} 行）`).join('；');d.appendChild(s)}if(meta?.model){const r=document.createElement('div');r.className='route';const u=meta.usage?.usage_reported?` · ${meta.usage.total_tokens} Token${meta.usage.cost_cny===null?' · 价格未配置':` · ¥${meta.usage.cost_cny.toFixed(6)}`}`:meta.usage?' · 供应商未返回用量':'';r.textContent=`后台路由：${meta.model.route} · ${meta.model.provider} · ${meta.model.model}${u}`;d.appendChild(r)}$('chat').appendChild(d);d.scrollIntoView({block:'end'})}async function load(){const [history,usage]=await Promise.all([fetch('/api/history?session_id='+encodeURIComponent(sid)),fetch('/api/usage/summary?session_id='+encodeURIComponent(sid))]);const h=await history.json(),u=await usage.json();$('history').innerHTML='';for(const x of h.items||[]){const li=document.createElement('li');li.textContent=x.question;$('history').appendChild(li)}$('calls').textContent=u.successful_calls||0;$('tokens').textContent=(u.total_tokens||0).toLocaleString();$('cost').textContent=`¥${Number(u.cost_cny||0).toFixed(6)}${u.unpriced_calls?' + 未定价':''}${u.unmetered_calls?' + 未计量':''}`}$('send').onclick=async()=>{const q=$('q').value.trim();if(!q)return;msg(q,'user');$('q').value='';$('send').disabled=true;try{const r=await fetch('/api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_id:sid,question:q})});const j=await r.json();if(!j.ok)throw new Error(j.error);msg(j.answer,'bot',j);await load()}catch(e){msg('查询失败：'+e.message,'bot')}finally{$('send').disabled=false}};$('q').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click()}});load()})();</script></body></html>
